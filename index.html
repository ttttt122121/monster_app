<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Коллекционер вкусов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #141414;
  --card: #1A1A1A;
  --line: #2A2A2A;
  --accent: #A6FF00;
  --text: #FFFFFF;
  --muted: #B3B3B3;
  --nav-h: 64px;
  --zoom: 1;               /* зум картинок банок; 1 = без зума (новый формат 3:4 уже с нужными полями) */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }

main { padding: 16px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }

/* ── шапка экрана ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.top .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.pill { border: 1px solid var(--accent); color: var(--accent); padding: 8px 14px; border-radius: 999px;
  font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, color .15s; }
.pill:active { background: var(--accent); color: #000; }
.back { width: 36px; height: 36px; flex: none; border: 1px solid var(--line); background: var(--card);
  border-radius: 50%; font-size: 22px; line-height: 1; color: var(--text); padding-bottom: 3px; }

/* ── сетка банок: 4 в ряд, картинки 3:4 (например 750x1000) → вертикальные плитки ── */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid.four { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { position: relative; display: block; text-align: left; min-width: 0; }
.can { position: relative; aspect-ratio: 3 / 4; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  transition: border-color .15s, transform .1s; }
/* зум задаётся через --zoom в :root; при значении > 1 .can обрезает поля через overflow:hidden */
.can img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 0;
  transform: scale(var(--zoom)); transform-origin: center; }
.tile:active .can { border-color: var(--accent); transform: scale(.97); }
.badge { position: absolute; top: 6px; right: 6px; background: var(--accent); color: #000;
  font-size: 11px; font-weight: 800; border-radius: 8px; padding: 2px 6px; }
.tile.off .can { opacity: .6; }
.tile.off img { filter: grayscale(0); }
.ph { font-size: 30px; opacity: .5; }


/* ── категории каталога ── */
.cat { margin-bottom: 26px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 10px; }
.cat-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.cat-head span { color: var(--muted); font-size: 13px; }

/* ── пустые состояния, загрузка, ошибки ── */
.empty { text-align: center; color: var(--muted); padding: 56px 24px; line-height: 1.5; }
.empty b { color: var(--text); display: block; font-size: 17px; margin-bottom: 6px; }
.empty .pill { margin-top: 16px; }
.skel { background: linear-gradient(90deg, var(--card), #232323, var(--card)); background-size: 200% 100%;
  animation: shimmer 1.2s infinite linear; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ── нижняя навигация ── */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; z-index: 10;
  background: rgba(20,20,20,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; height: var(--nav-h); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; }
nav button.active { color: var(--accent); }
nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }

/* ── модальное окно управления вкусом ── */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: 10px; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); animation: fade .15s ease; }
.modal { position: relative; width: 100%; max-width: 560px; max-height: 94vh; overflow: auto;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px;
  animation: pop .18s ease; }
/* верх окна: крупное фото слева (доминирует), информация справа */
.m-top { display: flex; align-items: flex-start; gap: 12px; }
.modal .pic { flex: 0 0 64%; aspect-ratio: 3 / 4; background: var(--bg);
  border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: center;
  justify-content: center; overflow: hidden; }
.modal .pic img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 0;
  transform: scale(var(--zoom)); transform-origin: center; }
.modal .pic .ph { font-size: 56px; }
.modal .info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 20px; }
.modal h3 { margin: 0; font-size: 15px; line-height: 1.2; text-align: left; word-break: break-word; }
.tags { display: flex; gap: 6px; justify-content: flex-start; flex-wrap: wrap; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 8px; }
.tag.lime { color: var(--accent); border-color: var(--accent); }
.added { color: var(--muted); font-size: 12px; text-align: left; }

.rate-box { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.rate-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.rate-val { color: var(--accent); font-size: 20px; font-weight: 800; }
/* шкала оценки: 10 банок, накопительная подсветка 1..N */
.rate { display: flex; gap: 2px; }
.rate button { flex: 1 1 0; min-width: 0; padding: 4px 0 2px; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: 0; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 13px;
  line-height: 1; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: color .12s, transform .12s; }
.rate button:active { transform: scale(.92); }
.rate .can-ico { width: 100%; max-width: 24px; height: auto; aspect-ratio: 30 / 68; display: block; overflow: visible; }
.rate .can-ico path, .rate .can-ico rect { fill: #2A2A2A; transition: fill .12s; }
.rate button.on .can-ico path, .rate button.on .can-ico rect { fill: var(--c, #A6FF00); }
.rate button.on { color: var(--c, var(--accent)); }
.rate button.sel { color: #fff; }
.modal [hidden] { display: none !important; }
.err { color: var(--text); font-size: 13px; text-align: center; min-height: 0; }
.err:empty { display: none; }

.actions { display: flex; flex-direction: column; gap: 8px; }
.btn { width: 100%; height: 46px; border-radius: 12px; background: var(--accent); color: #000;
  font-weight: 700; font-size: 15px; transition: opacity .15s; }
.btn:disabled { opacity: .35; }
.btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.btn.ghost.armed { color: var(--accent); border-color: var(--accent); }
.close { position: absolute; top: 8px; right: 10px; width: 32px; height: 32px; color: var(--muted); font-size: 20px; z-index: 1; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }

/* ── toast ── */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 76px + env(safe-area-inset-bottom)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--card); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 18px; padding: 9px 18px; font-size: 14px; font-weight: 600;
  width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.3; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── профиль ── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.card-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 14px; }
.card-title h2 { margin: 0; font-size: 16px; font-weight: 700; }
.card-title span { color: var(--muted); font-size: 12px; }
.me { display: flex; align-items: center; gap: 14px; }
.avatar { width: 56px; height: 56px; flex: none; border-radius: 50%; background: var(--bg);
  border: 2px solid var(--accent); color: var(--accent); font-size: 24px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
  opacity: 0; transition: opacity .3s ease; }
.avatar img.ok { opacity: 1; }
.me .who { min-width: 0; }
.me .nm { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .hd { color: var(--muted); font-size: 14px; margin-top: 2px; }
.note { color: var(--muted); font-size: 13px; line-height: 1.45; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 800; }
.stat b.accent { color: var(--accent); }
.stat small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.crow { margin-bottom: 12px; }
.crow:last-child { margin-bottom: 0; }
.crow .line { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 6px; }
.crow .line span { color: var(--muted); font-size: 13px; }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ── достижения ── */
.ach-list { display: flex; flex-direction: column; gap: 10px; }
.ach { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.ach .body { flex: 1; min-width: 0; }
.ach h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.25; }
.ach p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.ach .prog { margin-top: 10px; }
.ach .prog .line { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.ach .date { margin-top: 8px; font-size: 12px; color: var(--accent); }
.ach.zero { opacity: .5; }                                   /* не начато: без цвета */
.ach.part { opacity: .5; border-color: rgba(166,255,0,.4); }  /* в процессе: акцент + прогресс-бар */
.ach.done { border-color: var(--accent); background: linear-gradient(135deg, rgba(166,255,0,.14), var(--card) 65%); }
.ach.done .body { padding-right: 26px; }
.ach .badge { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; }
.ach .badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.6;
  stroke-linecap: round; stroke-linejoin: round; }

/* матрица активности: неделя / месяц / 3 месяца — календари, год — сетка в стиле GitHub */
.heat-months { display: grid; grid-template-columns: repeat(var(--cols, 13), 1fr); gap: 3px; height: 14px; margin-bottom: 4px; }
.heat-months span { font-size: 10px; line-height: 14px; color: var(--muted); white-space: nowrap; }
.heat { display: grid; grid-template-columns: repeat(var(--cols, 13), 1fr); grid-template-rows: repeat(7, auto);
  grid-auto-flow: column; gap: 3px; }
.heat.dense { gap: 2px; }
/* короткие периоды (неделя, месяц): календарь 7 колонок (Пн–Вс), недели — строками */
.heat-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.heat-wd span { text-align: center; font-size: 10px; color: var(--muted); }
.heat.cal { grid-template-columns: repeat(7, 1fr); grid-template-rows: none; grid-auto-flow: row; gap: 6px; }
.heat.cal .cell { aspect-ratio: auto; height: 38px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; color: var(--muted); }
.heat.cal .cell.l1, .heat.cal .cell.l2 { color: var(--text); }
.heat.cal .cell.l3, .heat.cal .cell.l4 { color: #000; font-weight: 700; }
.heat.cal .cell.none { color: transparent; }
/* переключатель периода: ряд табов-пилюль в шапке карточки */
.card-title.has-seg { margin-bottom: 10px; }
.act-seg { display: flex; gap: 4px; padding: 3px; margin-bottom: 14px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 12px; }
.act-seg button { flex: 1 1 0; min-width: 0; height: 30px; padding: 0 4px; border: 0; border-radius: 9px; background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s; }
.act-seg button:active { opacity: .8; }
.act-seg button.on { background: var(--accent); color: #000; }
.cal-title { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
.cal-block + .cal-block { margin-top: 16px; }
.heat .cell[data-k] { cursor: pointer; }
.heat.cal .cell.future { color: #4a4a4a; }
.cell.today { outline: 1.5px solid var(--text); outline-offset: -1.5px; }
.heat.cal.compact .cell { height: 26px; font-size: 10px; border-radius: 6px; }
.heat-months.dense { gap: 2px; }
/* окно «что добавлено в этот день» */
.day-sum { color: var(--muted); font-size: 14px; margin: 0; }
.day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.day-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; font-size: 15px; }
.day-list time { color: var(--muted); font-size: 13px; flex: none; }
.cell { aspect-ratio: 1 / 1; border-radius: 2px; background: #202020; }
.cell.l1 { background: #425818; }
.cell.l2 { background: #639010; }
.cell.l3 { background: #85C708; }
.cell.l4 { background: #A6FF00; }
.cell.none { background: transparent; }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 12px;
  color: var(--muted); font-size: 12px; white-space: nowrap; }
.legend .cell { width: 12px; flex: none; }
.legend em { font-style: normal; margin: 0 4px; }

/* ───────── v2: вишлист, поиск, пометки ───────── */
[hidden] { display: none !important; }
.ico { display: inline-flex; flex: none; }
.ico svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }

/* значок «в вишлисте» в правом верхнем углу плитки (вне .can, чтобы не серел вместе с банкой) */
.mark { position: absolute; top: 6px; right: 6px; z-index: 1; width: 22px; height: 22px; padding: 5px;
  border-radius: 50%; background: var(--bg); border: 1px solid var(--accent); color: var(--accent);
  pointer-events: none; }
.mark svg { fill: currentColor; stroke-width: 1.4; }

/* кнопка «Вишлист» — поверх экрана, над нижней навигацией */
.fab { position: fixed; z-index: 9; display: flex; align-items: center; gap: 8px; height: 46px;
  right: max(14px, calc((100vw - 640px) / 2 + 14px));
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  padding: 0 16px 0 14px; border-radius: 999px; background: var(--accent); color: #000;
  font-weight: 800; font-size: 15px;
  box-shadow: 0 8px 24px rgba(166,255,0,.22), 0 2px 8px rgba(0,0,0,.55); transition: transform .1s; }
.fab:active { transform: scale(.96); }
.fab .ico { width: 20px; height: 20px; }
.fab .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #000;
  color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.fab-space { padding-bottom: 64px; }

/* поиск */
.search { position: relative; margin-bottom: 14px; }
.search input { width: 100%; height: 48px; padding: 0 44px; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; outline: none;
  -webkit-appearance: none; appearance: none; transition: border-color .15s; }
.search input:focus { border-color: var(--accent); }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search .si { position: absolute; left: 14px; top: 15px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .clr { position: absolute; right: 7px; top: 7px; width: 34px; height: 34px; border-radius: 50%;
  color: var(--muted); font-size: 16px; }

.photo { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: 16px 14px; margin-bottom: 18px; background: var(--card); border: 1.5px dashed var(--line);
  border-radius: 16px; transition: border-color .15s; }
.photo:active { border-color: var(--accent); }
.photo .ico { width: 40px; height: 40px; padding: 9px; border-radius: 12px; background: var(--bg);
  border: 1px solid var(--line); color: var(--accent); }
.photo b { font-size: 15px; }
.photo small { color: var(--muted); font-size: 12px; line-height: 1.35; }

.res-meta { color: var(--muted); font-size: 13px; margin: 0 2px 10px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px;
  transition: border-color .15s, transform .1s; }
.row:active { border-color: var(--accent); transform: scale(.99); }
.row .th { width: 48px; flex: none; aspect-ratio: 3 / 4; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.row .th img { width: 100%; height: 100%; object-fit: contain; display: block; }
.row .th .ph { font-size: 20px; }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.row .nm { font-size: 15px; font-weight: 700; line-height: 1.2; word-break: break-word; }
.row .ct { color: var(--muted); font-size: 12px; }

/* выбор действия в модалке поиска */
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice button { min-height: 48px; padding: 0 8px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center;
  justify-content: center; gap: 6px; transition: border-color .12s, color .12s, background .12s; }
.choice button .ico { width: 16px; height: 16px; }
.choice button.sel { border-color: var(--accent); color: var(--accent); background: rgba(166,255,0,.08); }
.m-note { color: var(--muted); font-size: 13px; line-height: 1.4; }

/* ───────── v3: добавление по фото ───────── */
.cam { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column; background: #000; animation: fade .15s ease; }
.cam-view { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #000; }
.cam-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
/* видоискатель: рамка остаётся яркой, всё вокруг затемнено на 50% её box-shadow */
.cam-frame { position: absolute; border: 2px solid rgba(255,255,255,.92); border-radius: 22px;
  box-shadow: 0 0 0 200vmax rgba(0,0,0,.5); pointer-events: none; }
.cam-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 13px;
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
.cam-x { position: absolute; z-index: 1; top: calc(10px + env(safe-area-inset-top)); right: 12px; width: 38px; height: 38px;
  border-radius: 50%; background: rgba(20,20,20,.7); color: var(--text); font-size: 18px; }
.cam-bar { display: flex; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); }
.shutter { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg);
  box-shadow: 0 0 0 3px var(--accent); transition: transform .1s; }

<body>
<main id="main"></main>
<nav id="nav"></nav>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor('#141414');
      tg.setBackgroundColor('#141414');
      if (tg.setBottomBarColor) tg.setBottomBarColor('#141414');
    } catch (e) { /* старые версии клиента — не критично */ }
  }

  const main = document.getElementById('main');
  const nav = document.getElementById('nav');

  const ICONS = {
    collection: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    camera: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    achievements: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>',
  };
  const ACH_ICONS = {
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  };
  const TABS = [
    { id: 'collection', label: 'Коллекция' },
    { id: 'search', label: 'Поиск' },
    { id: 'achievements', label: 'Достижения' },
    { id: 'profile', label: 'Профиль' },
  ];

  // режимы блока «Активность»: week — текущая неделя Пн–Вс, month — календарь текущего месяца,
  // quarter — сетка GitHub за последние 13 недель, year — сетка GitHub за текущий год
  const PERIODS = [
    { key: 'week', label: 'Неделя', full: 'за неделю' },
    { key: 'month', label: 'Месяц', full: 'за месяц' },
    { key: 'quarter', label: '3 месяца', full: 'за 3 месяца' },
    { key: 'year', label: 'Год', full: 'за год' },
  ];
  let periodIdx = 1;                                    // по умолчанию «за месяц»; выбор живёт между перерисовками экрана
  // sub: main | catalog | wishlist (внутри «Коллекции») | settings | admin (внутри «Профиля»)
  // q — запрос поиска; photoFails — неудачных или ложных распознаваний по фото подряд (с 1-й показываем «Предложить вкус»)
  const state = { tab: 'collection', sub: 'main', q: '', photoFails: 0 };
  let renderSeq = 0;
  let modalEl = null;

  /* ── утилиты ── */
  // Все тексты вставляются через textContent — названия из базы не могут сломать вёрстку.
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;            // только статичные иконки
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  }

  async function request(path, { method = 'GET', body, signal } = {}) {
    const headers = {
      'X-Telegram-Init-Data': (tg && tg.initData) || '',
      'ngrok-skip-browser-warning': '1',
    };
    // FormData отправляем как есть: браузер сам выставит multipart-границу
    const isForm = typeof FormData !== 'undefined' && body instanceof FormData;
    if (body !== undefined && !isForm) headers['Content-Type'] = 'application/json';
    const resp = await fetch(path, {
      method,
      headers,
      signal,
      body: body === undefined ? undefined : isForm ? body : JSON.stringify(body),
    });
    if (!resp.ok) {
      let detail = '';
      try {
        const j = await resp.json();
        if (typeof j.detail === 'string') detail = j.detail;   // у 422 detail — массив, его не показываем
      } catch (e) {}
      const err = new Error(detail || ('Ошибка ' + resp.status));
      err.status = resp.status;
      throw err;
    }
    return resp.json();
  }

  // ── Кеш ответов API (в памяти) ──
  // GET /api/collection, /api/catalog, /api/wishlist, /api/me отдаются из кеша, пока данные «свежие» (API_TTL):
  // переключение вкладок не ходит в сеть. Любое изменение данных (PUT/POST/DELETE) сбрасывает весь кеш.
  const CACHEABLE = new Set(['/api/collection', '/api/catalog', '/api/wishlist', '/api/me', '/api/achievements']);
  const API_TTL = 2 * 60 * 1000;                         // мс; дальше данные считаются устаревшими
  const apiCache = new Map();                            // path -> { t, data }
  const apiInflight = new Map();                         // path -> Promise: два одинаковых запроса сразу — одна загрузка
  let apiEpoch = 0;                                      // растёт при каждом сбросе: запоздавший ответ не попадёт в кеш
  const cloneData = (d) => (typeof structuredClone === 'function' ? structuredClone(d) : JSON.parse(JSON.stringify(d)));
  function invalidateApiCache() { apiCache.clear(); apiInflight.clear(); apiEpoch++; }

  // opts.fresh — игнорировать кеш и перезагрузить (результат всё равно кладётся в кеш)
  async function api(path, opts = {}) {
    const method = opts.method || 'GET';
    if (method === 'GET') {
      if (!CACHEABLE.has(path) || opts.signal) return request(path, opts);
      if (!opts.fresh) {
        const hit = apiCache.get(path);
        if (hit && Date.now() - hit.t < API_TTL) return cloneData(hit.data);
        const wait = apiInflight.get(path);
        if (wait) return wait.then(cloneData);
      }
      const epoch = apiEpoch;
      const p = request(path, opts).then((data) => {
        if (epoch === apiEpoch) apiCache.set(path, { t: Date.now(), data });
        return data;
      });
      const cleanup = () => { if (apiInflight.get(path) === p) apiInflight.delete(path); };
      p.then(cleanup, cleanup);
      apiInflight.set(path, p);
      return p.then(cloneData);                          // views получают копию и не могут испортить кеш
    }
    try {
      const res = await request(path, opts);
      announceAchievements(res);
      return res;
    } finally {
      // изменения (и неудачные тоже: после 404/409 состояние на сервере могло отличаться) → кеш недействителен.
      // Поиск по фото данные не меняет.
      if (path !== '/api/search-by-photo') invalidateApiCache();
    }
  }

  // GIF-анимации при получении особых достижений: id достижения → файл
  const ACHIEVEMENT_GIFS = {
    lando: '/static/images/lando.gif',
    vr46: '/static/images/vr46.gif',
    hamilton: '/static/images/lewis-hamilton.gif',
    litvin: '/static/images/litvin.gif',
  };

  // Длительность одного прохода GIF (мс) — сумма задержек кадров из самого файла
  function gifDurationMs(buf) {
    const u = new Uint8Array(buf);
    if (u.length < 14 || u[0] !== 0x47 || u[1] !== 0x49 || u[2] !== 0x46) return 0;
    let pos = 13;
    if (u[10] & 0x80) pos += 3 * (1 << ((u[10] & 7) + 1));              // глобальная палитра
    const skip = (i) => { while (i < u.length && u[i] !== 0) i += u[i] + 1; return i + 1; };
    let total = 0;
    while (pos < u.length) {
      const t = u[pos];
      if (t === 0x21) {                                                    // расширение
        if (u[pos + 1] === 0xF9) total += (u[pos + 4] | (u[pos + 5] << 8)) * 10;   // задержка кадра, 1/100 с
        pos = skip(pos + 2);
      } else if (t === 0x2C) {                                             // кадр
        const flags = u[pos + 9];
        pos += 10;
        if (flags & 0x80) pos += 3 * (1 << ((flags & 7) + 1));            // локальная палитра
        pos = skip(pos + 1);
      } else break;                                                        // 0x3B — конец файла
    }
    return total;
  }
  // GIF грузятся в фоне заранее (одним запросом: из тех же байтов и blob-URL, и длительность). В момент показа
  // ничего не ждём: готовый GIF открывается из памяти, а если не успел загрузиться — сразу по обычному URL
  // с фиксированным таймером автозакрытия.
  const gifStore = new Map();                             // src -> { url, ms }
  const gifLoading = new Map();
  function preloadGif(src) {
    if (gifStore.has(src)) return Promise.resolve(gifStore.get(src));
    if (gifLoading.has(src)) return gifLoading.get(src);
    const p = fetch(src, { headers: { 'ngrok-skip-browser-warning': '1' } })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then((buf) => {
        let ms = 0;
        try { ms = gifDurationMs(buf); } catch (e) {}
        const info = { url: URL.createObjectURL(new Blob([buf], { type: 'image/gif' })), ms };
        gifStore.set(src, info);
        return info;
      })
      .finally(() => gifLoading.delete(src));
    p.catch(() => {});
    gifLoading.set(src, p);
    return p;
  }
  function preloadAllGifs() {                             // по одному и в простое, чтобы не мешать интерфейсу
    const queue = Object.values(ACHIEVEMENT_GIFS);
    const step = () => {
      const src = queue.shift();
      if (!src) return;
      preloadGif(src).catch(() => {}).then(() => setTimeout(step, 300));
    };
    step();
  }

  // Окно с GIF: только анимация по центру, без текста и кнопок. Плавно появляется,
  // после одного прохода GIF (или по тапу) так же плавно исчезает. Живёт отдельно от обычных окон.
  function playAchievementGif(a, { url, ms }, onDone, onFail) {
    const img = el('img', { src: url, alt: a.title, draggable: 'false' });
    const box = el('div', { class: 'gif-pop', role: 'img', 'aria-label': 'Новое достижение: ' + a.title }, img);
    let closed = false, timer = null;
    const close = () => {
      if (closed) return;
      closed = true;
      clearTimeout(timer);
      box.classList.remove('in');
      setTimeout(() => { box.remove(); if (onDone) onDone(); }, 450);
    };
    // таймер автозакрытия стартует, когда GIF реально показан: длительность из файла или 4 с, если она неизвестна
    const arm = () => { if (!timer && !closed) timer = setTimeout(close, Math.min(Math.max(ms || 4000, 1800), 8000) + 350); };
    img.addEventListener('load', arm);
    img.addEventListener('error', () => {                 // не загрузился: убираем окно и сообщаем обычным тостом
      if (closed) return;
      closed = true;
      box.remove();
      if (onFail) onFail(); else if (onDone) onDone();
    });
    box.addEventListener('click', close);
    document.body.append(box);
    void box.offsetWidth;                                  // фиксируем начальное состояние, чтобы сработала анимация
    box.classList.add('in');
    hapticOk();
    if (img.complete && img.naturalWidth) arm();
  }

  // Сервер возвращает new_achievements в ответах на изменение коллекции/вишлиста.
  // Достижение с GIF показывается сразу; обычные — тостом с небольшой задержкой, чтобы не затереть «Добавлено…»
  function announceAchievements(res) {
    const list = res && Array.isArray(res.new_achievements) ? res.new_achievements : [];
    if (!list.length) return;
    const showToast = (arr) => {
      hapticOk();
      toast((arr.length > 1 ? 'Новые достижения: ' : 'Новое достижение: ') + arr.map((a) => a.title).join(', '));
    };
    const specials = list.filter((a) => ACHIEVEMENT_GIFS[a.id]);
    const rest = list.filter((a) => !ACHIEVEMENT_GIFS[a.id]);
    if (!specials.length) { setTimeout(() => showToast(list), 1300); return; }
    // несколько особых достижений сразу — показываем GIF по очереди; обычные идут тостом в конце
    const next = (i) => {
      if (i >= specials.length) { if (rest.length) showToast(rest); return; }
      const src = ACHIEVEMENT_GIFS[specials[i].id];
      const info = gifStore.get(src) || { url: src, ms: 0 };         // не готов — открываем сразу по обычному URL
      if (!gifStore.has(src)) preloadGif(src).catch(() => {});         // и догружаем в фоне на будущее
      playAchievementGif(specials[i], info, () => next(i + 1), () => { showToast([specials[i]]); next(i + 1); });
    };
    next(0);
  }

  function parseUtc(s) {                                 // сервер отдаёт UTC: 'YYYY-MM-DD HH:MM:SS'
    if (!s) return null;
    const d = new Date(s.replace(' ', 'T') + 'Z');
    return isNaN(d) ? null : d;
  }

  function fmtDate(s) {
    const d = parseUtc(s);
    return d ? d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
  }

  // «15 ноября 2026, 14:32» — точные дата и время в часовом поясе пользователя
  function fmtDateTime(s) {
    const d = parseUtc(s);
    if (!d) return '—';
    const parts = {};
    new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
      .formatToParts(d).forEach((x) => { parts[x.type] = x.value; });
    return `${parts.day} ${parts.month} ${parts.year}, ${parts.hour}:${parts.minute}`;
  }

  function plural(n, forms) {                            // ['банка', 'банки', 'банок']
    const m = n % 100, k = n % 10;
    if (m > 10 && m < 20) return forms[2];
    if (k === 1) return forms[0];
    if (k >= 2 && k <= 4) return forms[1];
    return forms[2];
  }
  const CANS = ['банка', 'банки', 'банок'];

  // <img src> не может отправить свои заголовки, а ngrok (бесплатный) вместо картинки
  // отдаёт HTML-страницу с предупреждением. Поэтому качаем картинку через fetch()
  // с заголовком ngrok-skip-browser-warning и показываем через blob-URL.
  // Кеш ограничен (LRU): в мобильном WebView blob-URL держат картинки в памяти, поэтому при переполнении
  // самые давние записи вытесняются. Чтобы при быстром скролле не было пиков сборки мусора:
  //  • освобождение URL (revokeObjectURL) откладывается и идёт небольшими пачками, а не по одному на каждую плитку;
  //  • скачивания идут через очередь с ограничением параллелизма (BLOB_FETCH_SLOTS), новые плитки — первыми;
  //  • плитка, уехавшая с экрана до старта загрузки, из очереди выпадает и не качается вовсе.
  const BLOB_CACHE_MAX = 100;
  const BLOB_FETCH_SLOTS = 6;
  const blobCache = new Map();                      // src -> Promise<blob-URL>; порядок вставки = порядок давности
  const blobJobs = new Map();                       // src -> { skips: [fn] } пока загрузка ждёт очереди
  const blobQueue = [];                             // ждущие загрузки; берём с конца (LIFO): свежие плитки важнее
  let blobActive = 0;
  const revokeQueue = [];
  let revokeTimer = null;

  function flushRevoke() {
    revokeTimer = null;
    for (const u of revokeQueue.splice(0, 12)) URL.revokeObjectURL(u);
    if (revokeQueue.length) revokeTimer = setTimeout(flushRevoke, 150);
  }
  function evictBlobs() {
    while (blobCache.size > BLOB_CACHE_MAX) {
      const oldest = blobCache.keys().next().value;
      const pending = blobCache.get(oldest);
      blobCache.delete(oldest);
      pending.then((url) => {
        revokeQueue.push(url);
        if (!revokeTimer) revokeTimer = setTimeout(flushRevoke, 3000);   // даём картинке, что ещё на экране, спокойно доиграть
      }, () => {});
    }
  }
  function pumpBlobs() {
    while (blobActive < BLOB_FETCH_SLOTS && blobQueue.length) {
      const job = blobQueue.pop();
      const meta = blobJobs.get(job.src);
      blobJobs.delete(job.src);
      if (meta && meta.skips.every((f) => f())) {                       // все, кто ждал, уже ушли с экрана
        if (blobCache.get(job.src) === job.p) blobCache.delete(job.src);
        job.reject(Object.assign(new Error('skipped'), { skipped: true }));
        continue;
      }
      blobActive++;
      fetch(job.src, { headers: { 'ngrok-skip-browser-warning': '1' } })
        .then((r) => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.blob();
        })
        .then((b) => {
          if (!b.type.startsWith('image/')) throw new Error('not an image');
          return URL.createObjectURL(b);
        })
        .then(job.resolve, job.reject)
        .finally(() => { blobActive--; pumpBlobs(); });
    }
  }
  // skip — необязательная функция «загрузка больше не нужна» (плитка вне экрана); без неё загрузка не отменяется
  function loadBlob(src, skip) {
    if (blobCache.has(src)) {                       // попадание: помечаем запись как «свежую»
      const hit = blobCache.get(src);
      blobCache.delete(src);
      blobCache.set(src, hit);
      const meta = blobJobs.get(src);
      if (meta) meta.skips.push(skip || (() => false));
      return hit;
    }
    let resolve, reject;
    const p = new Promise((a, b) => { resolve = a; reject = b; });
    p.catch(() => { if (blobCache.get(src) === p) blobCache.delete(src); });
    blobCache.set(src, p);
    blobJobs.set(src, { skips: [skip || (() => false)] });
    blobQueue.push({ src, p, resolve, reject });
    evictBlobs();
    pumpBlobs();
    return p;
  }

  // Ленивая загрузка: качаем картинку, когда плитка подъезжает к экрану
  const imgObserver = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries) => {
        for (const e of entries) {
          const img = e.target;
          img._vis = e.isIntersecting;
          if (e.isIntersecting && !img._started) img._load();
        }
      }, { rootMargin: '300px' })
    : null;

  function canImg(src, alt) {
    if (!src) return el('div', { class: 'ph' });
    const img = el('img', { alt, decoding: 'async' });
    const fail = () => img.replaceWith(el('div', { class: 'ph' }));
    let retried = false;
    img._vis = !imgObserver;
    img._started = false;
    img._load = () => {
      img._started = true;
      loadBlob(src, () => !img._vis || !img.isConnected).then((url) => {
        img.src = url;
        if (imgObserver) imgObserver.unobserve(img);
      }, (e) => {
        if (e && e.skipped) img._started = false;    // уехала с экрана до старта: загрузим, когда вернётся
        else fail();
      });
    };
    img.addEventListener('error', () => {
      // blob-URL мог быть освобождён при вытеснении из кеша — один раз качаем заново
      if (!retried && blobCache.get(src) === undefined) { retried = true; img._load(); } else fail();
    });
    if (imgObserver) imgObserver.observe(img); else img._load();   // ленивая загрузка у границы экрана
    return img;
  }

  function haptic() {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
  function hapticOk() {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }

  let toastTimer = null;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast', class: 'toast' }); document.body.append(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3600);   // было 1800 мс: даём время спокойно прочитать
  }

  /* ── плитка банки ── */
  function tile(item, { badge, off, wish, onclick }) {
    return el('button', { class: 'tile' + (off ? ' off' : ''), 'aria-label': item.title + (wish ? ', в вишлисте' : ''), onclick },
      el('div', { class: 'can' },
        canImg(item.image, item.title),
        badge != null ? el('span', { class: 'badge', text: String(badge) }) : null),
      wish ? el('span', { class: 'ico mark', 'aria-hidden': 'true', html: ICONS.bookmark }) : null);
  }

  function skeleton() {
    return el('div', { class: 'grid' },
      Array.from({ length: 12 }, () => el('div', { class: 'tile' }, el('div', { class: 'can skel' }))));
  }

  /* ── модальное окно вкуса ──
     mode:
       view   — только просмотр (каталог «Все вкусы»), без изменения данных
       manage — вкус в коллекции: изменить оценку / удалить
       wish   — вкус в вишлисте: перенести в коллекцию (с оценкой) / удалить из вишлиста
       add    — вкус нигде не числится (поиск): сразу шкала оценки; выбрали оценку →
                «Добавить в коллекцию», либо запасная кнопка «В вишлист» */
  function openModal(item, { mode, category, fromPhoto }) {
    closeModal();
    haptic();
    const collected = mode === 'manage' || (mode === 'view' && !!item.is_collected);
    const wished = mode === 'wish' || (mode === 'view' && !collected && !!item.in_wishlist);
    const initial = mode === 'manage' && item.rating != null ? item.rating : null;
    let selected = initial;
    let step = 'choose';                                 // choose — выбор действия, rate — шкала оценки
    let busy = false;

    const valueEl = el('span', { class: 'rate-val' });
    const errEl = el('div', { class: 'err' });
    let hover = 0;                                       // предпросмотр при наведении мыши (только desktop)
    // силуэт по эталону: тонкий ободок, плавные плечики, ровные стенки, срезанные нижние углы; без рисунка внутри
    const CAN_SVG = '<svg class="can-ico" viewBox="0 0 30 68" aria-hidden="true">'
      + '<rect x="1.8" y="0" width="26.4" height="1.8"/>'
      + '<path d="M2.8 2.2H27.2Q30 3.6 30 7.2V64.2L26.6 67.6H3.4L0 64.2V7.2Q0 3.6 2.8 2.2Z"/></svg>';
    // персональный цвет каждой банки: от красного (1) к фирменному салатовому (10)
    const RATE_COLORS = ['#FF3333', '#FF5500', '#FF7A00', '#FFB000', '#FFCC00',
                         '#FFEE00', '#DCEE00', '#C4EE00', '#B0FF00', '#A6FF00'];
    const rateBtns = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1;
      const b = el('button', {
        type: 'button', 'aria-label': 'Оценка ' + n + ' из 10',
        onclick: () => { if (busy) return; selected = n; errEl.textContent = ''; haptic(); sync(); },
      });
      b.innerHTML = CAN_SVG;
      b.style.setProperty('--c', RATE_COLORS[i]);
      b.append(el('span', { text: String(n) }));
      b.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && !busy) { hover = n; paintRate(); } });
      b.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { hover = 0; paintRate(); } });
      return b;
    });
    // накопительная подсветка: загораются все банки с 1-й по N-ю (N — наведённая или выбранная)
    function paintRate() {
      const n = hover || selected || 0;
      rateBtns.forEach((b, i) => {
        b.classList.toggle('on', i < n);
        b.classList.toggle('sel', selected === i + 1);
        b.setAttribute('aria-pressed', selected === i + 1 ? 'true' : 'false');
      });
    }
    const rateBox = el('div', { class: 'rate-box' },
      el('div', { class: 'rate-head' }, el('span', { text: 'Ваша оценка' }), valueEl),
      el('div', { class: 'rate', role: 'group', 'aria-label': 'Оценка от 1 до 10' }, rateBtns));

    // Пошаговая схема. Шаг 1 «choose»: только выбор действия. Шаг 2 «rate»: шкала банок + подтверждение.
    //   add    — «Добавить в коллекцию» → шкала → «Подтвердить добавление»; «В вишлист» — сразу в вишлист
    //   wish   — «Перенести в коллекцию» → шкала → «Подтвердить перенос»; «Удалить из вишлиста»
    //   manage — «Изменить оценку» → шкала → «Сохранить новую оценку»; «Удалить из коллекции»
    const editable = mode !== 'view';
    const collectBtn = editable ? el('button', {
      class: 'btn', type: 'button',
      text: mode === 'add' ? 'Добавить в коллекцию' : mode === 'wish' ? 'Перенести в коллекцию' : 'Изменить оценку',
      onclick: () => { if (busy) return; step = 'rate'; errEl.textContent = ''; haptic(); sync(); },
    }) : null;
    const wishBtn = mode === 'add'
      ? el('button', { class: 'btn ghost', type: 'button', text: 'В вишлист', onclick: addToWishlist }) : null;
    const primary = editable ? el('button', { class: 'btn', type: 'button', onclick: submit }) : null;
    const backBtn = editable ? el('button', {
      class: 'btn ghost', type: 'button', text: 'Назад',
      onclick: () => { if (busy) return; step = 'choose'; selected = initial; errEl.textContent = ''; sync(); },
    }) : null;
    const delLabel = mode === 'manage' ? 'Удалить из коллекции' : 'Удалить из вишлиста';
    const delBtn = (mode === 'manage' || mode === 'wish')
      ? el('button', { class: 'btn ghost', type: 'button', text: delLabel, onclick: remove })
      : null;

    // Только для вкуса, найденного по фото: распознали неверно → считаем попытку неудачной
    // и сразу предлагаем отправить вкус на добавление в каталог.
    const wrongBtn = fromPhoto && editable
      ? el('button', { class: 'btn ghost', type: 'button', text: 'Это не тот вкус', onclick: wrongFlavor })
      : null;
    function wrongFlavor() {
      if (busy) return;
      closeModal();
      state.photoFails += 1;
      state.tab = 'search'; state.sub = 'main';
      render().then(() => openSuggestFlavor({ source: 'photo', wrong: true }));
    }

    function sync() {
      const rating = step === 'rate';
      paintRate();
      valueEl.textContent = selected ? selected + '/10' : '—';
      valueEl.style.color = selected ? RATE_COLORS[selected - 1] : '';   // текст оценки в цвете выбранной банки
      rateBtns.forEach((b) => { b.disabled = busy; });
      if (!editable) return;
      rateBox.hidden = !rating;
      collectBtn.hidden = rating;
      if (wishBtn) wishBtn.hidden = rating;
      if (delBtn) delBtn.hidden = rating;
      if (wrongBtn) wrongBtn.hidden = rating;
      primary.hidden = !rating;
      backBtn.hidden = !rating;
      let label, ok;
      if (mode === 'manage') {
        const changed = selected !== initial;
        ok = !!selected && changed;
        label = changed ? 'Сохранить новую оценку' : 'Оценка не изменена';
      } else {
        ok = !!selected;
        label = !selected ? 'Выберите оценку' : mode === 'wish' ? 'Подтвердить перенос' : 'Подтвердить добавление';
      }
      primary.disabled = busy || !ok;
      primary.textContent = label;
      collectBtn.disabled = busy;
      backBtn.disabled = busy;
      if (wishBtn) wishBtn.disabled = busy;
      if (delBtn) delBtn.disabled = busy;
      if (wrongBtn) wrongBtn.disabled = busy;
    }

    function done(msg) {
      hapticOk();
      closeModal();
      toast(msg);
      render({ keepScroll: true });
    }

    async function act(call, okMsg, failMsg) {
      busy = true; errEl.textContent = ''; sync();
      try {
        await call();
        done(okMsg);
      } catch (e) {
        busy = false;
        errEl.textContent = e.message || failMsg;
        sync();
      }
    }

    function submit() {
      if (busy || !primary || primary.disabled) return;
      const id = item.id;
      if (mode === 'manage')
        return act(() => api('/api/collection/' + id, { method: 'PUT', body: { rating: selected } }),
          'Оценка сохранена', 'Не удалось сохранить');
      if (mode === 'wish')
        return act(() => api(`/api/wishlist/${id}/collect`, { method: 'POST', body: { rating: selected } }),
          'Перенесено в коллекцию', 'Не удалось перенести');
      return act(() => api('/api/collection/' + id, { method: 'PUT', body: { rating: selected } }),
        'Добавлено в коллекцию', 'Не удалось добавить');
    }

    function addToWishlist() {
      if (busy) return;
      return act(() => api('/api/wishlist/' + item.id, { method: 'PUT' }),
        'Добавлено в вишлист', 'Не удалось добавить');
    }

    let armed = false, armTimer = null;
    async function remove() {
      if (busy) return;
      if (!armed) {                                      // двухшаговое подтверждение
        armed = true;
        delBtn.textContent = 'Нажмите ещё раз, чтобы удалить';
        delBtn.classList.add('armed');
        armTimer = setTimeout(() => {
          armed = false;
          delBtn.textContent = delLabel;
          delBtn.classList.remove('armed');
        }, 3000);
        return;
      }
      clearTimeout(armTimer);
      armed = false;
      delBtn.textContent = delLabel;
      delBtn.classList.remove('armed');
      const url = (mode === 'manage' ? '/api/collection/' : '/api/wishlist/') + item.id;
      await act(() => api(url, { method: 'DELETE' }),
        mode === 'manage' ? 'Удалено из коллекции' : 'Удалено из вишлиста', 'Не удалось удалить');
    }

    const dateLine = collected && item.added_at ? 'Добавлено: ' + fmtDate(item.added_at)
      : mode === 'wish' && item.added_at ? 'В вишлисте с ' + fmtDate(item.added_at) : null;

    const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } },
      el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
        el('button', { class: 'close', 'aria-label': 'Закрыть', text: '✕', onclick: closeModal }),
        el('div', { class: 'm-top' },
          el('div', { class: 'pic' }, canImg(item.image, item.title)),
          el('div', { class: 'info' },
            el('h3', { text: item.title }),
            el('div', { class: 'tags' },
              category ? el('span', { class: 'tag', text: category }) : null,
              collected ? el('span', { class: 'tag lime', text: 'В коллекции' }) : null,
              wished ? el('span', { class: 'tag lime', text: 'В вишлисте' }) : null,
              mode === 'view' && collected && item.rating != null
                ? el('span', { class: 'tag', text: 'Оценка ' + item.rating + '/10' }) : null),
            dateLine ? el('div', { class: 'added', text: dateLine }) : null)),
        editable ? rateBox : null,
        editable ? el('div', { class: 'actions' }, errEl, collectBtn, wishBtn, primary, backBtn, delBtn, wrongBtn) : null));
    sync();
    document.body.append(overlay);
    document.body.style.overflow = 'hidden';
    modalEl = overlay;
    updateBack();
  }

  function closeModal() {
    if (!modalEl) return;
    if (modalEl._cleanup) modalEl._cleanup();            // например, остановить поток камеры
    modalEl.remove();
    modalEl = null;
    document.body.style.overflow = '';
    updateBack();
  }

  /* ── экраны: коллекция, вишлист, каталог ── */
  function goSub(sub) { state.sub = sub; render(); }

  function wishFab(count) {
    return el('button', { class: 'fab', type: 'button', 'aria-label': 'Вишлист', onclick: () => { haptic(); goSub('wishlist'); } },
      el('span', { class: 'ico', html: ICONS.bookmark }),
      el('span', { text: 'Вишлист' }),
      count > 0 ? el('span', { class: 'cnt', text: String(count) }) : null);
  }

  function collectionView(d) {
    const { items, stats } = d;
    const head = el('div', { class: 'top' },
      el('div', { class: 'left' },
        el('div', {},
          el('h1', { text: 'Моя коллекция' }),
          el('div', { class: 'sub', text: `Собрано ${stats.tried} из ${stats.total}` }))),
      el('button', { class: 'pill', text: 'Все вкусы', onclick: () => goSub('catalog') }));

    const fab = wishFab(stats.wishlist || 0);

    if (!items.length) {
      return el('div', {}, head,
        el('div', { class: 'empty' },
          el('b', { text: 'Пока пусто' }),
          el('div', {}, el('button', { class: 'pill', text: 'Добавить первую банку', onclick: () => { state.tab = 'search'; state.sub = 'main'; render(); } }))),
        fab);
    }
    return el('div', { class: 'fab-space' }, head,
      el('div', { class: 'grid' },
        items.map((it) => tile(it, {
          badge: it.rating,
          onclick: () => openModal(it, { mode: 'manage', category: it.category }),
        }))),
      fab);
  }

  function wishlistView(d) {
    const head = el('div', { class: 'top' },
      el('div', { class: 'left' },
        el('button', { class: 'back', 'aria-label': 'Назад', text: '‹', onclick: () => goSub('main') }),
        el('div', {},
          el('h1', { text: 'Вишлист' }),
          el('div', { class: 'sub', text: `Хочу попробовать: ${d.count}` }))));

    if (!d.items.length) {
      return el('div', {}, head,
        el('div', { class: 'empty' },
          el('b', { text: 'Вишлист пуст' }),
          'Найди вкус через поиск и добавь его сюда, чтобы не забыть попробовать.',
          el('div', {}, el('button', { class: 'pill', text: 'Добавить первую банку', onclick: () => { state.tab = 'search'; state.sub = 'main'; render(); } }))));
    }
    return el('div', {}, head,
      el('div', { class: 'note', style: 'margin:-6px 2px 14px', text: 'Нажмите на банку, чтобы перенести её в коллекцию с оценкой или убрать из вишлиста.' }),
      el('div', { class: 'grid' },
        d.items.map((it) => tile(it, {
          onclick: () => openModal(it, { mode: 'wish', category: it.category }),
        }))));
  }

  // Каталог — чистый режим просмотра: без оценок, коллекции и вишлиста
  function catalogView(d) {
    const total = d.categories.reduce((s, c) => s + c.total, 0);
    const got = d.categories.reduce((s, c) => s + c.collected, 0);
    const wish = d.categories.reduce((s, c) => s + (c.wishlisted || 0), 0);
    const head = el('div', { class: 'top' },

  /* ── добавление по фото ── */
  // Только прямая съёмка: встроенная камера (openLiveCamera) через getUserMedia.
  // Выбор файлов из галереи отключён.

  // Встроенная камера через getUserMedia: задняя камера, снимок кадра в JPEG.
  // Требует разрешения на камеру в клиенте Telegram.
  // Видоискатель: вертикальная рамка под банку по центру (высота/ширина = 2.53).
  // Ширина — до 70% ширины экрана, высота — до 80% высоты, чтобы банку было удобно держать в руке.
  const CAM_FRAME_RATIO = 2.53;                          // банка Monster: 168 мм / 66,5 мм
  const CAM_CROP_MARGIN = 0;                             // запас вокруг рамки при обрезке (доля от её размера); 0 — строго по рамке
  function camFrameRect(w, h) {
    const fw = Math.min(w * 0.7, (h * 0.8) / CAM_FRAME_RATIO);
    const fh = fw * CAM_FRAME_RATIO;
    return { x: (w - fw) / 2, y: (h - fh) / 2, w: fw, h: fh };
  }
  // Область видео (в пикселях кадра), которая лежит внутри рамки + запас.
  // video показан через object-fit: cover, поэтому учитываем масштаб и обрезку по краям.
  function camCropRect(viewW, viewH, vidW, vidH) {
    const f = camFrameRect(viewW, viewH);
    const mx = f.w * CAM_CROP_MARGIN, my = f.h * CAM_CROP_MARGIN;
    const s = Math.max(viewW / vidW, viewH / vidH);      // масштаб cover
    const ox = (viewW - vidW * s) / 2, oy = (viewH - vidH * s) / 2;
    const x0 = Math.max(0, (f.x - mx - ox) / s), y0 = Math.max(0, (f.y - my - oy) / s);
    const x1 = Math.min(vidW, (f.x + f.w + mx - ox) / s), y1 = Math.min(vidH, (f.y + f.h + my - oy) / s);
    return { sx: Math.round(x0), sy: Math.round(y0), sw: Math.max(1, Math.round(x1 - x0)), sh: Math.max(1, Math.round(y1 - y0)) };
  }

  const canLiveCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  async function openLiveCamera() {
    closeModal();
    haptic();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false,
      });
    } catch (e) {
      toast(e && e.name === 'NotAllowedError'
        ? 'Нет доступа к камере. Разрешите её в настройках Telegram'
        : 'Камера недоступна на этом устройстве');
      return;
    }
    const video = el('video', { autoplay: '', muted: '', playsinline: '', 'aria-label': 'Камера' });
    video.muted = true;                                  // нужно для автозапуска на iOS
    video.srcObject = stream;
    const frame = el('div', { class: 'cam-frame' });
    const view = el('div', { class: 'cam-view' }, video, frame,
      el('div', { class: 'cam-hint', text: 'Поместите банку в рамку' }));
    const layoutFrame = () => {
      const r = camFrameRect(view.clientWidth, view.clientHeight);
      frame.style.left = r.x + 'px'; frame.style.top = r.y + 'px';
      frame.style.width = r.w + 'px'; frame.style.height = r.h + 'px';
    };
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(layoutFrame) : null;
    if (ro) ro.observe(view); else window.addEventListener('resize', layoutFrame);
    const stop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (ro) ro.disconnect(); else window.removeEventListener('resize', layoutFrame);
    };
    const flash = el('div', { class: 'cam-flash', 'aria-hidden': 'true' });
    view.append(flash);
    let shooting = false;
    const shutterBtn = el('button', { class: 'shutter', type: 'button', 'aria-label': 'Сделать снимок', onclick: () => shoot() });
    const resetShot = () => {
      shooting = false;
      shutterBtn.disabled = false;
      video.play().catch(() => {});
    };
    const shoot = () => {
      if (shooting || !video.videoWidth) return;
      shooting = true;
      shutterBtn.disabled = true;
      haptic();
      // область кадра считаем сразу, в момент нажатия
      const c = camCropRect(view.clientWidth, view.clientHeight, video.videoWidth, video.videoHeight);
      video.pause();                                     // «замораживаем» кадр, чтобы он не менялся во время обработки
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');   // вспышка затвора
      // Тяжёлую часть (отрисовка + кодирование в JPEG) выносим в requestAnimationFrame:
      // первый кадр успевает показать вспышку, а UI не подвисает.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
          const cv = document.createElement('canvas');
          cv.width = c.sw; cv.height = c.sh;
          cv.getContext('2d').drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, c.sw, c.sh);
          cv.toBlob((blob) => {
            if (!blob) { toast('Не удалось сделать снимок'); resetShot(); return; }
            handlePhoto(new File([blob], 'camera.jpg', { type: 'image/jpeg' }));   // handlePhoto закроет камеру
          }, 'image/jpeg', 0.9);
        } catch (e) {
          toast('Не удалось сделать снимок');
          resetShot();
        }
      }));
    };
    const overlay = el('div', { class: 'cam', role: 'dialog', 'aria-modal': 'true' },
      el('button', { class: 'cam-x', type: 'button', 'aria-label': 'Закрыть', text: '✕', onclick: closeModal }),
      view,
      el('div', { class: 'cam-bar' }, shutterBtn));
    overlay._cleanup = stop;                             // closeModal остановит камеру
    document.body.append(overlay);
    document.body.style.overflow = 'hidden';
    modalEl = overlay;
    updateBack();
    layoutFrame();
    video.play().catch(() => {});
  }

  // Окно с инструкцией. openLiveCamera вызывается прямо из обработчика нажатия
  // (в жесте пользователя), как того требует запрос разрешения на камеру.
  function openPhotoSheet() {
    closeModal();
    haptic();
    const go = el('button', { class: 'btn', type: 'button', text: 'Сделать фото',
      onclick: () => {

        openLiveCamera();
      } });
    const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } },
      el('div', { class: 'modal sheet instr', role: 'dialog', 'aria-modal': 'true' },
        el('button', { class: 'close', 'aria-label': 'Закрыть', text: '✕', onclick: closeModal }),
        el('h3', { class: 'sheet-t', text: 'Сфотографируйте переднюю часть банки' }),

  // Уменьшаем фото до 1280 px и сохраняем как JPEG: быстрее загрузка, меньше трафик,
  // и HEIC с iPhone превращается в понятный серверу JPEG. Если не вышло — шлём оригинал.
  async function prepareImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(bmp.width * k));
      cv.height = Math.max(1, Math.round(bmp.height * k));
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
      if (bmp.close) bmp.close();
      const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.85));
      if (blob) return blob;
    } catch (e) { /* формат не декодируется в браузере — отправим как есть */ }
    return file;
  }

  let scanEl = null;
  async function handlePhoto(file) {
    if (scanEl) return;                                  // уже идёт распознавание
    closeModal();
    haptic();
    const ac = new AbortController();
    let timedOut = false, previewUrl = null;
    const shot = el('div', { class: 'shot' });
    scanEl = el('div', { class: 'scan', role: 'status', 'aria-live': 'polite' },
      shot,
      el('b', { text: 'Распознаю банку' }),
      el('div', { class: 'note', text: 'Обычно это занимает несколько секунд' }),
      el('button', { class: 'pill', type: 'button', text: 'Отмена', onclick: () => ac.abort() }));
    document.body.append(scanEl);
    document.body.style.overflow = 'hidden';
    const finish = () => {
      if (scanEl) scanEl.remove();
      scanEl = null;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      document.body.style.overflow = modalEl ? 'hidden' : '';
    };

    let item;
    const timer = setTimeout(() => { timedOut = true; ac.abort(); }, 40000);
    try {
      const blob = await prepareImage(file);
      if (ac.signal.aborted) throw new Error('aborted');
      previewUrl = URL.createObjectURL(blob);
      shot.append(el('img', { src: previewUrl, alt: '' }));
      const fd = new FormData();
      fd.append('file', blob, 'photo.jpg');
      const res = await api('/api/search-by-photo', { method: 'POST', body: fd, signal: ac.signal });
      if (res.status === 'lit_energy') {
        // Lit Energy: в коллекцию не добавляется. Первый раз api() уже запустил GIF «Литвина» (new_achievements);
        // повторный скан — только короткое уведомление
        clearTimeout(timer);
        finish();
        invalidateApiCache();                                  // скрытое достижение теперь должно появиться в списке
        if (!(res.new_achievements || []).length) toast(res.message || 'Эта банка не добавляется в коллекцию');
        return;
      }
      if (res.status !== 'success' || !res.item) {
        // несколько банок или банка не найдена: показываем подсказку сервера
        clearTimeout(timer);
        finish();
        toast(res.message || 'Не удалось распознать банку');
        if (res.status === 'not_found') {
          state.photoFails += 1;
          if (state.tab === 'search') render({ keepScroll: true });   // показать карточку «Предложить вкус»
        }
        return;
      }
      item = res.item;
    } catch (e) {
      clearTimeout(timer);
      finish();
      if (ac.signal.aborted) toast(timedOut ? 'Сервер долго отвечает. Попробуйте ещё раз' : 'Распознавание отменено');
      else {
        toast(e.message || 'Не удалось распознать банку');
        // «неудача» — только когда сервер ответил, что вкус не определён (404); сбои сети/ключа не считаем
        if (e.status === 404) {
          state.photoFails += 1;
          if (state.tab === 'search') render({ keepScroll: true });   // показать карточку «Предложить вкус»
        }
      }
      return;
    }
    clearTimeout(timer);
    finish();
    hapticOk();

    // закрываем поиск и сразу открываем окно вкуса
    state.photoFails = 0;
    state.tab = 'collection'; state.sub = 'main';
    await render();
    toast('Нашли: ' + item.title);
    openModal(item, {
      category: item.category,
      mode: item.is_collected ? 'manage' : item.in_wishlist ? 'wish' : 'add',
      fromPhoto: true,
    });
  }

  /* ── экран: поиск ── */
  // «ё» → «е», без знаков препинания, нижний регистр
  function norm(s) {
    return String(s || '').toLowerCase().replace(/ё/g, 'е')
      .replace(/[^\p{L}\p{N}\s]+/gu, ' ').replace(/\s+/g, ' ').trim();
  }
  // Пока строка поиска пуста, показываем только эти вкусы (в таком порядке).
  // Сопоставление идёт по названию в каталоге: сначала точное совпадение, затем «содержит».
  const POPULAR = [
    'Original Green', 'Ultra White', 'Mango Loco', 'Ultra Strawberry Dreams', 'Ultra Blue',
    'Zero Sugar', 'Bad Apple', 'Rio Punch', 'Ultra Paradise', 'Pipeline Punch',
  ];
  function popularFlavors(all) {
    const out = [], seen = new Set();
    for (const name of POPULAR) {
      const n = norm(name);
      const it = all.find((x) => x._t === n && !seen.has(x.id)) || all.find((x) => x._t.includes(n) && !seen.has(x.id));
      if (it) { seen.add(it.id); out.push(it); }
    }
    return out.length ? out : all.slice(0, POPULAR.length);   // если названия в каталоге другие — первые 10
  }

  function searchRow(it, onpick) {
    const tags = [];
    if (it.is_collected) tags.push(el('span', { class: 'tag lime', text: 'В коллекции ' + it.rating + '/10' }));
    else if (it.in_wishlist) tags.push(el('span', { class: 'tag lime', text: 'В вишлисте' }));
    return el('button', { class: 'row', type: 'button', 'aria-label': it.title, onclick: onpick },
      el('div', { class: 'th' }, canImg(it.image, it.title)),
      el('div', { class: 'tx' },
        el('div', { class: 'nm', text: it.title }),
        el('div', { class: 'ct', text: it.category }),
        tags.length ? el('div', { class: 'tags' }, tags) : null));
  }

  function searchView(d) {
    // плоский список вкусов + заранее нормализованные строки для быстрого поиска
    const all = [];
    for (const c of d.categories) {
      for (const it of c.items) {
        all.push({ ...it, category: c.name, _t: norm(it.title), _h: norm([it.title, c.name, it.keywords].join(' ')) });
      }
    }

    const input = el('input', {
      type: 'search', placeholder: 'Название или ключевое слово', autocomplete: 'off',
      autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'search', 'aria-label': 'Поиск вкуса',
    });
    input.value = state.q;
    const clr = el('button', { class: 'clr', type: 'button', 'aria-label': 'Очистить', text: '✕',
      onclick: () => { input.value = ''; update(); input.focus(); } });
    const meta = el('div', { class: 'res-meta' });
    const list = el('div', { class: 'rows' });

    function update() {
      state.q = input.value;
      clr.hidden = !input.value;
      const tokens = norm(input.value).split(' ').filter(Boolean);
      let found = tokens.length ? all : popularFlavors(all);
      if (tokens.length) {
        const q = tokens.join(' ');
        const rank = (it) => (it._t.startsWith(q) ? 0 : it._t.includes(q) ? 1 : 2);
        found = all.filter((it) => tokens.every((t) => it._h.includes(t))).sort((a, b) => rank(a) - rank(b));
      }
      meta.textContent = !all.length ? ''
        : tokens.length ? `Найдено: ${found.length}`
        : 'Популярные вкусы';

      if (!all.length) {
        list.replaceChildren(el('div', { class: 'empty' }, 'Каталог пока пуст.'));
        return;
      }
      if (!found.length) {
        // первый же ненаход → предлагаем добавить этот вкус в каталог
        list.replaceChildren(el('div', { class: 'empty' },
          el('b', { text: 'Ничего не нашлось' }),
          'Попробуйте ещё раз. Если такого вкуса нет в каталоге, предложите и мы его добавим',
          el('div', {}, el('button', { class: 'pill', type: 'button', text: 'Предложить вкус',
            onclick: () => { input.blur(); openSuggestFlavor({ source: 'text', title: input.value.trim() }); } }))));
        return;
      }
      list.replaceChildren(...found.map((it) => searchRow(it, () => {
        input.blur();
        openModal(it, { category: it.category, mode: it.is_collected ? 'manage' : it.in_wishlist ? 'wish' : 'add' });
      })));
    }
    input.addEventListener('input', update);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    update();

    return el('div', {},
      el('div', { class: 'top' }, el('div', { class: 'left' }, el('div', {},
        el('h1', { text: 'Поиск' })))),
      el('div', { class: 'search' },
        el('span', { class: 'ico si', html: ICONS.search }), input, clr),
      el('button', { class: 'photo', type: 'button', onclick: openPhotoSheet },
        el('span', { class: 'ico', html: ICONS.camera }),
        el('b', { text: 'Добавить по фото' })),
      state.photoFails >= 1
        ? el('div', { class: 'sugg' },
            el('div', { class: 'note', text: 'Не получается распознать банку? Возможно, этого вкуса ещё нет в каталоге.' }),
            el('button', { class: 'pill', type: 'button', text: 'Предложить вкус', onclick: () => openSuggestFlavor({ source: 'photo' }) }))
        : null,
      meta, list);
  }

  /* ── экран: профиль ── */
  function tgUser() {
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    return u || { first_name: 'Test', username: 'testuser' };   // запасной вариант вне Telegram

  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }

  // Окно дня: точная дата, сколько банок добавлено и какие именно
  function openDayModal(date, list) {
    closeModal();
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const title = cap(date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      .replace(/\s*г\.$/, ''));

      el('li', {}, el('span', { text: x.title }),
        el('time', { text: x.d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) })));
    const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } },
      el('div', { class: 'modal sheet', role: 'dialog', 'aria-modal': 'true' },

        el('h3', { class: 'sheet-t', text: title }),

        el('ul', { class: 'day-list' }, rows)));
    document.body.append(overlay);
    document.body.style.overflow = 'hidden';
    modalEl = overlay;
    updateBack();
  }

  function activityCard(items) {
    // что и когда добавлено в каждый (локальный) день
    const perDay = new Map();
    for (const it of items) {
      const d = parseUtc(it.added_at);
      if (!d) continue;
      const k = dayKey(d);
      if (!perDay.has(k)) perDay.set(k, []);
      perDay.get(k).push({ title: it.title, d });
    }

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const todayKey = dayKey(today);
    const level = (n) => (n <= 0 ? 0 : n >= 4 ? 4 : n);
    const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const mondayIndex = (d) => (d.getDay() + 6) % 7;                  // Пн = 0 … Вс = 6
    const monthTitle = (y, m) => cap(new Date(y, m, 1).toLocaleDateString('ru-RU', { month: 'long' })) + ' ' + y;
    const MON3 = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    const dates = new Map();                                          // dayKey -> Date плиток на экране
    const body = el('div');

    function makeCell(date, showNum) {
      const key = dayKey(date);
      dates.set(key, date);
      const n = (perDay.get(key) || []).length;
      const label = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      return el('div', {
        class: 'cell l' + level(n) + (date > today ? ' future' : '') + (key === todayKey ? ' today' : ''),
        'data-k': key,
        title: n ? `${label}: ${n} ${plural(n, CANS)}` : `${label}: ничего`,
        text: showNum ? String(date.getDate()) : null,
      });
    }
    const weekdays = () => el('div', { class: 'heat-wd' }, WD.map((x) => el('span', { text: x })));

    // календарь одного месяца: 7 колонок Пн–Вс, 1-е число стоит под своим днём недели
    function monthBlock(y, m, compact) {
      const lead = mondayIndex(new Date(y, m, 1));
      const days = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(el('div', { class: 'cell none' }));
      for (let d = 1; d <= days; d++) cells.push(makeCell(new Date(y, m, d), true));
      return el('div', { class: 'cal-block' },
        el('div', { class: 'cal-title', text: monthTitle(y, m) }),
        weekdays(),
        el('div', { class: 'heat cal' + (compact ? ' compact' : '') }, cells));
    }

    function drawWeek() {                                             // текущая неделя целиком: Пн–Вс
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - mondayIndex(today));
      const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
      const fmt = (d) => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      const range = start.getMonth() === end.getMonth()
        ? `${start.getDate()}–${fmt(end)}` : `${fmt(start)} – ${fmt(end)}`;
      const cells = Array.from({ length: 7 }, (_, i) =>
        makeCell(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), true));
      return [el('div', { class: 'cal-block' },
        el('div', { class: 'cal-title', text: 'Текущая неделя: ' + range }),
        weekdays(),
        el('div', { class: 'heat cal' }, cells))];
    }

    function drawQuarter() {                                          // 13 недель подряд, последняя — текущая; недели — колонками
      const weeks = 13;
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - mondayIndex(today) - 7 * (weeks - 1));
      const dayAt = (off) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + off);
      const cells = [];
      for (let i = 0; i < weeks * 7; i++) cells.push(makeCell(dayAt(i), false));
      // подписи месяцев: над колонкой, где встречается 1-е число; начало диапазона подписываем, если до первой метки есть место
      const marks = [];
      for (let w = 0; w < weeks; w++) {
        for (let d = 0; d < 7; d++) {
          const date = dayAt(w * 7 + d);
          if (date.getDate() === 1) marks.push({ w, m: date.getMonth() });
        }
      }
      if (!marks.length || marks[0].w >= 3) marks.unshift({ w: 0, m: dayAt(0).getMonth() });
      const labels = marks.map(({ w, m }) =>
        el('span', { style: `grid-column:${w + 1} / span ${Math.min(3, weeks - w)}`, text: MON3[m] }));
      const fmt = (d) => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      return [
        el('div', { class: 'cal-title', text: `Последние 13 недель: ${fmt(start)} – ${fmt(today)}` }),
        el('div', { class: 'heat-months', style: `--cols:${weeks}` }, labels),
        el('div', { class: 'heat', style: `--cols:${weeks}` }, cells),
      ];
    }

    function drawYear() {                                             // январь–декабрь текущего года, недели — колонками
      const y = today.getFullYear();
      const jan1 = new Date(y, 0, 1);
      const lead = mondayIndex(jan1);
      const daysInYear = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
      const cols = Math.ceil((lead + daysInYear) / 7);
      const cells = [];
      for (let i = 0; i < cols * 7; i++) {
        const di = i - lead;
        cells.push(di < 0 || di >= daysInYear
          ? el('div', { class: 'cell none' })
          : makeCell(new Date(y, 0, 1 + di), false));
      }
      const labels = [];
      for (let m = 0; m < 12; m++) {
        const di = Math.round((new Date(y, m, 1) - jan1) / 864e5);
        const col = Math.floor((lead + di) / 7);
        labels.push(el('span', { style: `grid-column:${col + 1} / span ${Math.min(3, cols - col)}`, text: MON3[m] }));
      }
      return [
        el('div', { class: 'cal-title', text: String(y) }),
        el('div', { class: 'heat-months dense', style: `--cols:${cols}` }, labels),
        el('div', { class: 'heat dense', style: `--cols:${cols}` }, cells),
      ];
    }

    function draw() {
      dates.clear();
      const key = PERIODS[periodIdx].key;
      body.replaceChildren(...(key === 'week' ? drawWeek() : key === 'quarter' ? drawQuarter()
        : key === 'year' ? drawYear() : [monthBlock(today.getFullYear(), today.getMonth(), false)]));
    }

    // клик по дню: будущее — ничего; прошлое без добавлений — тост; с добавлениями — окно со списком
    body.addEventListener('click', (e) => {
      const c = e.target.closest('.cell[data-k]');
      const date = c && dates.get(c.dataset.k);
      if (!date || date > today) return;                              // будущие дни: ничего не происходит
      const list = perDay.get(c.dataset.k) || [];
      if (!list.length) {
        toast(date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ': ничего не добавлено');
        return;
      }
      haptic();
      openDayModal(date, list);
    });

    const segBtns = PERIODS.map((p, i) => el('button', {
      type: 'button', role: 'tab', text: p.label, 'aria-label': p.full,
      onclick: () => {
        if (i === periodIdx) return;
        haptic();
        periodIdx = i;
        paintSeg();
        draw();
      },
    }));
    function paintSeg() {
      segBtns.forEach((b, i) => {
        b.classList.toggle('on', i === periodIdx);
        b.setAttribute('aria-selected', i === periodIdx ? 'true' : 'false');
      });
    }
    paintSeg();
    draw();

    return el('section', { class: 'card' },
      el('div', { class: 'card-title has-seg' }, el('h2', { text: 'Активность' })),
      el('div', { class: 'act-seg', role: 'tablist', 'aria-label': 'Период активности' }, segBtns),
      body,
      el('div', { class: 'legend' },
        el('em', { text: 'Меньше' }),
        [0, 1, 2, 3, 4].map((l) => el('div', { class: 'cell l' + l })),
        el('em', { text: 'Больше' })));
  }
