  /* ── формы: «Предложить вкус» и «Есть идеи по разработке?» ── */
  // fields: [{ label, multiline, max, min, placeholder, value, required }]
  function openFormModal({ title, note, fields, submitLabel, okMsg, onSubmit, onDone, attach = false }) {
    closeModal();
    haptic();
    let busy = false;
    let file = null, previewUrl = null;                 // необязательное фото
    const errEl = el('div', { class: 'err' });
    const nodes = fields.map((f) => {
      const n = el(f.multiline ? 'textarea' : 'input', {
        class: 'field', maxlength: String(f.max), placeholder: f.placeholder || '', 'aria-label': f.label,
        rows: f.multiline ? '4' : null, type: f.multiline ? null : 'text', autocomplete: 'off',
      });
      n.value = f.value || '';
      n.addEventListener('input', () => { errEl.textContent = ''; sync(); });
      return n;
    });
    // Вложение: label+скрытый input (нажатие нативно открывает выбор файла), превью и кнопка «убрать»
    let attachBox = null;
    if (attach) {
      const inputId = 'attach-' + Math.random().toString(36).slice(2);
      const fileInput = el('input', { id: inputId, type: 'file', accept: 'image/*', class: 'vh', tabindex: '-1', 'aria-hidden': 'true' });
      const pick = el('label', { class: 'attach-btn', for: inputId, role: 'button', tabindex: '0',
        onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } } });
      const prev = el('div', { class: 'attach-prev' });
      prev.hidden = true;
      const clearFile = () => {
        file = null;
        if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
        prev.hidden = true; prev.replaceChildren();
        pick.textContent = 'Прикрепить фото (необязательно)';
        errEl.textContent = '';
      };
      clearFile();
      fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        fileInput.value = '';                            // чтобы то же фото можно было выбрать снова
        if (!f || busy) return;
        if (f.type && !f.type.startsWith('image/')) { toast('Выберите изображение'); return; }
        clearFile();
        file = f;
        previewUrl = URL.createObjectURL(f);
        prev.replaceChildren(
          el('img', { src: previewUrl, alt: 'Выбранное фото' }),
          el('button', { type: 'button', 'aria-label': 'Убрать фото', text: '✕', onclick: () => { if (!busy) { clearFile(); sync(); } } }));
        prev.hidden = false;
        pick.textContent = 'Заменить фото';
        sync();                                          // фото прикреплено — кнопка «Отправить» включается сразу
      });
      attachBox = el('div', { class: 'attach' }, fileInput, pick, prev);
    }
    const submit = el('button', { class: 'btn', type: 'button', text: submitLabel, onclick: send });
    // Форма готова к отправке, если текст нужной длины ИЛИ прикреплено фото
    function valid() {
      const textOk = fields.every((f, i) => !f.required || nodes[i].value.trim().length >= (f.min || 1));
      return textOk || (attach && !!file);
    }
    function sync() { submit.disabled = busy || !valid(); }
    async function send() {
      if (busy || !valid()) return;
      busy = true; errEl.textContent = ''; sync();
      try {
        let photo = null;
        if (file) {
          photo = await prepareImage(file);              // уменьшаем до 1280 px, HEIC → JPEG
          if (photo.size > 8 * 1024 * 1024) throw new Error('Фото слишком большое (максимум 8 МБ)');
        }
        await onSubmit(nodes.map((n) => n.value.trim()), photo);
        hapticOk();
        closeModal();
        toast(okMsg);
        if (onDone) onDone();
      } catch (e) {
        busy = false;
        errEl.textContent = e.message || 'Не удалось отправить';
        sync();
      }
    }
    const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } },
      el('div', { class: 'modal sheet', role: 'dialog', 'aria-modal': 'true' },
        el('button', { class: 'close', 'aria-label': 'Закрыть', text: '✕', onclick: closeModal }),
        el('h3', { class: 'sheet-t', text: title }),
        note ? el('div', { class: 'm-note', text: note }) : null,
        fields.map((f, i) => el('div', { class: 'f' }, el('div', { class: 'f-label', text: f.label }), nodes[i])),
        attachBox,
        el('div', { class: 'actions' }, errEl, submit)));
    overlay._cleanup = () => {                           // закрытие/успешная отправка: сбрасываем файл и превью
      file = null;
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    };
    sync();
    document.body.append(overlay);
    document.body.style.overflow = 'hidden';
    modalEl = overlay;
    updateBack();
  }

  // multipart-тело: текстовые поля + необязательное фото (поле «image»)
  function formData(fields, photo) {
    const fd = new FormData();
    Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
    if (photo) fd.append('image', photo, 'photo.jpg');
    return fd;
  }

        : null;
      card.append(el('div', { class: 'task' },
        el('div', { class: 't-head' },
          el('b', { text: '#' + (i + 1) }),
          kind === 'flavor' ? el('span', { class: 'tag', text: it.source === 'photo' ? 'по фото' : 'из поиска' }) : null,
          el('span', { class: 't-meta', text: 'ID ' + it.user_id + (d ? ', ' + fmtDateTime(it.created_at) : '') })),
        el('div', { class: 't-body', text: kind === 'flavor' ? it.title : it.text }),
        kind === 'flavor' && it.comment ? el('div', { class: 'note', text: it.comment }) : null,   // комментарии старых заявок
        thumb,
        btn));
    });
    return card;
  }

  function adminView(d) {
    return el('div', {},
      el('div', { class: 'top' }, el('div', { class: 'left' },
        el('button', { class: 'back', 'aria-label': 'Назад', text: '‹', onclick: goBack }),
        el('div', {},
          el('h1', { text: 'Админ-панель' }),
          el('div', { class: 'sub', text: `Вкусов: ${d.flavors.length}, идей: ${d.dev.length}` })))),
      adminSection('Предложения вкусов', d.flavors, 'flavor'),
      adminSection('Идеи по разработке', d.dev, 'dev'));
  }

  function errorView(err) {
    return el('div', { class: 'empty' },
      el('b', { text: 'Не удалось загрузить' }),
      err.message || 'Что-то пошло не так.',
      el('div', {}, el('button', { class: 'pill', text: 'Повторить', onclick: () => render() })));
  }

  /* ── навигация ── */
  function updateNav() {
    nav.replaceChildren(...TABS.map((t) =>
      el('button', {
        class: t.id === state.tab ? 'active' : '',
        onclick: () => { haptic(); state.tab = t.id; state.sub = 'main'; render(); },
      }, el('span', { html: ICONS[t.id] }), el('span', { text: t.label }))));
  }

  // Кнопка «назад» Telegram: закрывает окно или возвращает из каталога в коллекцию
  function updateBack() {
    if (!tg || !tg.BackButton) return;
    const needed = !!modalEl || state.sub !== 'main';
    needed ? tg.BackButton.show() : tg.BackButton.hide();
  }
  if (tg && tg.BackButton) {
    tg.BackButton.onClick(() => {
      if (modalEl) closeModal();
      else if (state.sub !== 'main') goBack();
    });
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // opts.keepScroll — перерисовать экран после изменения данных, не сбрасывая прокрутку
  async function render(opts) {
    const keep = !!(opts && opts.keepScroll);
    const my = ++renderSeq;           // защита от «гонки» при быстром переключении экранов
    const y = keep ? window.scrollY : 0;
    closeModal();
    updateNav();
    updateBack();
    if (!keep) window.scrollTo(0, 0);

    if (!keep) main.replaceChildren(skeleton());
    try {
      let view;
      if (state.tab === 'profile' && state.sub === 'settings') {
        view = settingsView(await api('/api/me'));
      } else if (state.tab === 'profile' && state.sub === 'admin') {
        view = adminView(await api('/api/admin/suggestions'));
      } else if (state.tab === 'profile') {
        const [col, cat] = await Promise.all([api('/api/collection'), api('/api/catalog')]);
        view = profileView(col, cat);
      } else if (state.tab === 'achievements') {
        view = achievementsView(await api('/api/achievements'));
      } else if (state.tab === 'search') {
        view = searchView(await api('/api/catalog'));
      } else if (state.sub === 'catalog') {
        view = catalogView(await api('/api/catalog'));
      } else if (state.sub === 'wishlist') {
        view = wishlistView(await api('/api/wishlist'));
      } else {
        view = collectionView(await api('/api/collection'));
      }
      if (my !== renderSeq) return;
      main.replaceChildren(view);
      if (keep) window.scrollTo(0, y);
    } catch (err) {
      if (my !== renderSeq) return;
      main.replaceChildren(errorView(err));
    }
  }

  render();
  // заранее грузим GIF достижений, чтобы показать их мгновенно
  setTimeout(preloadAllGifs, 1500);
})();
</script>
</body>
</html>
